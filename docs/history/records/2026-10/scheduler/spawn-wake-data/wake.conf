# sched-wake A/B: Trig main e5627bf built by Rig main 43e1f65f4 (p) and
# by the same Rig with wakeSpawned in sched.zig (w), both plain release;
# a byte-identical copy of p (a) as the A/A arm. One checker on core 6,
# four on 0,6,8,10.
W=/zfs/worktrees/rig/sched-wake3
V="p1 a1 w1 p4 a4 w4"
t="-p tsconfig.trig.json --noEmit"
WARM="taskset -c 6 /tmp/sw3/p -p tsconfig.trig.json --noEmit --singleThreaded; taskset -c 0,6,8,10 /tmp/sw3/p -p tsconfig.trig.json --noEmit --checkers 4"
cmd_of() {
  case $1 in
    p1) echo "taskset -c 6 /tmp/sw3/p $t --singleThreaded" ;;
    a1) echo "taskset -c 6 /tmp/sw3/a $t --singleThreaded" ;;
    w1) echo "taskset -c 6 /tmp/sw3/w $t --singleThreaded" ;;
    p4) echo "taskset -c 0,6,8,10 /tmp/sw3/p $t --checkers 4" ;;
    a4) echo "taskset -c 0,6,8,10 /tmp/sw3/a $t --checkers 4" ;;
    w4) echo "taskset -c 0,6,8,10 /tmp/sw3/w $t --checkers 4" ;;
  esac
}
