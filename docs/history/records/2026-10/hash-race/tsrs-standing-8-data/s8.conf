# standing-8, for /zfs/trig-pup/trial/time-ab.sh: Trig main PGO as
# tools/trig/pgo builds it (trig: CHECK_IDS false), a byte-identical copy
# (aa), Trig main PGO with CHECK_IDS true as standing-7's build had it
# (ids), tsrs 0.18.0 as shipped (tsrs) and in Go's mode (tsrsg:
# --checkerAssignment go --noLazyMembers). One checker or thread on P-core
# 6; four on P-cores 0, 6, 8 and 10. Binaries copied to tmpfs (B, /tmp/s8) for the run, as standing-7. S8W names the
# results directory. No variable may be named e, f, g, h, t0 or t1.
W=${S8W:-/zfs/worktrees/rig/standing-8/run}
B=${S8B:-/tmp/s8}
V="trig1 aa1 ids1 tsrs1 tsrsg1 trig4 aa4 ids4 tsrs4 tsrsg4"
t="-p tsconfig.trig.json --noEmit"
GO="--checkerAssignment go --noLazyMembers"
WARM="taskset -c 6 $B/trig $t --singleThreaded; taskset -c 0,6,8,10 $B/trig $t --checkers 4"
cmd_of() {
  case $1 in
    trig1) echo "taskset -c 6 $B/trig $t --singleThreaded" ;;
    aa1) echo "taskset -c 6 $B/aa $t --singleThreaded" ;;
    ids1) echo "taskset -c 6 $B/ids $t --singleThreaded" ;;
    tsrs1) echo "taskset -c 6 env RAYON_NUM_THREADS=1 $B/tsrs/tsrs $t --singleThreaded" ;;
    tsrsg1) echo "taskset -c 6 env RAYON_NUM_THREADS=1 $B/tsrs/tsrs $t $GO --singleThreaded" ;;
    trig4) echo "taskset -c 0,6,8,10 $B/trig $t --checkers 4" ;;
    aa4) echo "taskset -c 0,6,8,10 $B/aa $t --checkers 4" ;;
    ids4) echo "taskset -c 0,6,8,10 $B/ids $t --checkers 4" ;;
    tsrs4) echo "taskset -c 0,6,8,10 env RAYON_NUM_THREADS=4 $B/tsrs/tsrs $t --checkers 4" ;;
    tsrsg4) echo "taskset -c 0,6,8,10 env RAYON_NUM_THREADS=4 $B/tsrs/tsrs $t $GO --checkers 4" ;;
  esac
}
