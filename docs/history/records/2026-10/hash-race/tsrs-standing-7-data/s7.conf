# standing-7, for /zfs/trig-pup/trial/time-ab.sh: Trig main PGO (trig),
# a byte-identical copy of it (aa), Trig main without the three lib files
# tsrs 0.18.0 lacks (nolib), tsrs 0.18.0 as shipped (tsrs: its default
# checker assignment and lazy members) and in Go's mode (tsrsg:
# --checkerAssignment go --noLazyMembers, standing-6's tsrs). One checker
# or thread on P-core 6; four on P-cores 0, 6, 8 and 10. Binaries on
# tmpfs. S7W names the results directory.
W=${S7W:-/zfs/worktrees/rig/standing-7/run}
B=/tmp/s7
V="trig1 aa1 nolib1 tsrs1 tsrsg1 trig4 aa4 nolib4 tsrs4 tsrsg4"
t="-p tsconfig.trig.json --noEmit"
# GO, not g: time-ab.sh sets g (the gate) in each run.
GO="--checkerAssignment go --noLazyMembers"
WARM="taskset -c 6 $B/trig $t --singleThreaded; taskset -c 0,6,8,10 $B/trig $t --checkers 4"
cmd_of() {
  case $1 in
    trig1) echo "taskset -c 6 $B/trig $t --singleThreaded" ;;
    aa1) echo "taskset -c 6 $B/aa $t --singleThreaded" ;;
    nolib1) echo "taskset -c 6 $B/nolib $t --singleThreaded" ;;
    tsrs1) echo "taskset -c 6 env RAYON_NUM_THREADS=1 $B/tsrs/tsrs $t --singleThreaded" ;;
    tsrsg1) echo "taskset -c 6 env RAYON_NUM_THREADS=1 $B/tsrs/tsrs $t $GO --singleThreaded" ;;
    trig4) echo "taskset -c 0,6,8,10 $B/trig $t --checkers 4" ;;
    aa4) echo "taskset -c 0,6,8,10 $B/aa $t --checkers 4" ;;
    nolib4) echo "taskset -c 0,6,8,10 $B/nolib $t --checkers 4" ;;
    tsrs4) echo "taskset -c 0,6,8,10 env RAYON_NUM_THREADS=4 $B/tsrs/tsrs $t --checkers 4" ;;
    tsrsg4) echo "taskset -c 0,6,8,10 env RAYON_NUM_THREADS=4 $B/tsrs/tsrs $t $GO --checkers 4" ;;
  esac
}
