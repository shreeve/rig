# A/A test of time-ab.sh: standing-6's Trig (s) and two byte-identical
# copies (c, d), at one checker and at four.
W=/zfs/worktrees/rig/harness/aa
V="s1 c1 d1 s4 c4 d4"
t="-p tsconfig.trig.json --noEmit"
WARM="taskset -c 6 /tmp/harness/s -p tsconfig.trig.json --noEmit --singleThreaded; taskset -c 0,6,8,10 /tmp/harness/s -p tsconfig.trig.json --noEmit --checkers 4"
cmd_of() {
  case $1 in
    s1) echo "taskset -c 6 /tmp/harness/s $t --singleThreaded" ;;
    c1) echo "taskset -c 6 /tmp/harness/c $t --singleThreaded" ;;
    d1) echo "taskset -c 6 /tmp/harness/d $t --singleThreaded" ;;
    s4) echo "taskset -c 0,6,8,10 /tmp/harness/s $t --checkers 4" ;;
    c4) echo "taskset -c 0,6,8,10 /tmp/harness/c $t --checkers 4" ;;
    d4) echo "taskset -c 0,6,8,10 /tmp/harness/d $t --checkers 4" ;;
  esac
}
