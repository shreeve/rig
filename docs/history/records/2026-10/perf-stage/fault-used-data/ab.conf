# Row 45: release Trig 4bc7a9a from rig a32adf178: main (m), its copy (a),
# large blocks faulting in only the half a copy writes (h), none ahead (z),
# and large Lists growing by half again (g); at one checker and at four.
W=/zfs/worktrees/rig-rust-ports/r45/win
V="m1 a1 h1 z1 g1 m4 a4 h4 z4 g4"
t="-p tsconfig.trig.json --noEmit"
WARM="taskset -c 6 /tmp/r45/m $t --singleThreaded; taskset -c 0,6,8,10 /tmp/r45/m $t --checkers 4"
cmd_of() {
  b=${1%?}; n=${1#?}
  if [ $n = 1 ]; then echo "taskset -c 6 /tmp/r45/$b $t --singleThreaded"; else echo "taskset -c 0,6,8,10 /tmp/r45/$b $t --checkers 4"; fi
}
