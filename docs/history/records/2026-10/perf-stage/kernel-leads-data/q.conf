# Quiet level: unfrag 256 before each run; one checker on E-core 13.
V="main aa l2"
WARM=main
PRE="taskset -c 18,19 /zfs/worktrees/rig/kernel-leads/unfrag 256"
O=/zfs/worktrees/rig/kernel-leads/q
EV=duration_time,user_time,system_time,cpu_atom/cycles/u,cpu_atom/cycles/k,cpu_atom/instructions/u,cpu_atom/instructions/k,page-faults
t="-p tsconfig.trig.json --noEmit"
cmd_of() { echo "13 /tmp/kl/$1 $t --singleThreaded"; }
