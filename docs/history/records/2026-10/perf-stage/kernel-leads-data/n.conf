# Natural level, one checker on E-core 13; four on E-cores 14-17.
V="main aa l1 l2 l3 all main4 aa4 l34 all4"
WARM=main
O=/zfs/worktrees/rig/kernel-leads/n
EV=duration_time,user_time,system_time,cpu_atom/cycles/u,cpu_atom/cycles/k,cpu_atom/instructions/u,cpu_atom/instructions/k,page-faults
t="-p tsconfig.trig.json --noEmit"
cmd_of() {
  case $1 in
    *4) b=${1%4}; [ $b = l3 ] || true; echo "14-17 /tmp/kl/$b $t --checkers 4" ;;
    *) echo "13 /tmp/kl/$1 $t --singleThreaded" ;;
  esac
}
