# Table coloring (Rig e10087dd8 plus table-color, reserveTable starting each Table a different number of pages
# into its range): main (m), its byte-identical copy (a), color (c); Trig 07e4447 release --pgo, built on pup;
# color built by main's profile (2 changed functions unprofiled). Binaries in /tmp/color.
W=${W:-/zfs/trig-pup/tc/time}
V="m1 a1 c1 m4 a4 c4"
t="-p tsconfig.trig.json --noEmit"
WARM="taskset -c 6 /tmp/color/main -p tsconfig.trig.json --noEmit --singleThreaded; taskset -c 0,6,8,10 /tmp/color/main -p tsconfig.trig.json --noEmit --checkers 4"
cmd_of() {
  case $(echo $1 | cut -c1) in m) b=main ;; a) b=aa ;; c) b=color ;; esac
  if [ $(echo $1 | cut -c2) = 1 ]; then echo "taskset -c 6 /tmp/color/$b $t --singleThreaded"; else echo "taskset -c 0,6,8,10 /tmp/color/$b $t --checkers 4"; fi
}
