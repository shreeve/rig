[package]
name = "http-tokio"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
