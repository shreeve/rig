[package]
name = "bench-serde-default"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "serde_json_value"
path = "src/main.rs"

[dependencies]
# default features only: std; preserve_order off (BTreeMap), arbitrary_precision off, float_roundtrip off
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic: default (unwind)

