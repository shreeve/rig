[package]
name = "map"
version = "0.0.0"
edition = "2024"
publish = false

# One table a build: hashbrown (the crate, SwissTable) by default, or
# indexmap (insertion-ordered: a dense Vec of entries beside a
# hashbrown table of indices) with `--features indexmap`; foldhash, each
# crate's fast default, or Rig's Int hash with `--features mix`.
[features]
indexmap = []
mix = []

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
indexmap = "=2.14.2"
foldhash = "=0.2.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
