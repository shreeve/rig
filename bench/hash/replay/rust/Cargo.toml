[package]
name = "replay"
version = "0.0.0"
edition = "2024"
publish = false

# One table a build: the hashbrown crate with foldhash (its default, as
# bench/hash/rust times it), or with `--features fx` rustc-hash's
# FxHasher, as tsrs hashes; `--features std` times std's HashMap
# (hashbrown as std vendors it) instead, which is tsrs's `FxHashMap`.
[features]
fx = []
std = []

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
foldhash = "=0.2.0"
rustc-hash = "=2.1.3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
