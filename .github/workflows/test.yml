name: test

# Pull requests and pushes to main: a commit on a pull request's branch
# runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run it supersedes; runs on
# main each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    uses: ./.github/workflows/shards.yml
    with:
      os: ubuntu-latest

  # macOS runs on main only (and by hand): the account's few macOS runners
  # are shared with other repositories, and every pull request's fast gate
  # already runs on an Apple Silicon Mac before it merges.
  macos:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/shards.yml
    with:
      os: macos-latest

  # The checks the ruleset on main requires: each passes only when every
  # shard of its system passed. On a pull request the macOS shards are
  # skipped, and its check passes on that skip alone.
  test-ubuntu:
    name: test (ubuntu-latest)
    needs: ubuntu
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ubuntu.result }}" = success

  test-macos:
    name: test (macos-latest)
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.macos.result }}" = success || { test "${{ github.event_name }}" = pull_request && test "${{ needs.macos.result }}" = skipped; }
