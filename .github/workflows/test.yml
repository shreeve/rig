name: test

# Pull requests and pushes to main: a commit on a pull request's branch
# runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run it supersedes; runs on
# main each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    uses: ./.github/workflows/shards.yml
    with:
      os: ubuntu-latest

  macos:
    uses: ./.github/workflows/shards.yml
    with:
      os: macos-latest

  # The checks the ruleset on main requires: each passes only when every
  # shard of its system passed.
  test-ubuntu:
    name: test (ubuntu-latest)
    needs: ubuntu
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ubuntu.result }}" = success

  test-macos:
    name: test (macos-latest)
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.macos.result }}" = success
