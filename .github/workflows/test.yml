name: test

# Pull requests and pushes to main: a commit on a pull request's branch
# runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run it supersedes; runs on
# main each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rig
    steps:
      # Rig and Nexus side by side: the build and test/run look for
      # nexus/bin/nexus in a parent directory of the checkout.
      - uses: actions/checkout@v4
        with:
          path: rig

      # setup-zig also caches Zig's global cache between runs.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Nexus is pinned, so its binary is built once per runner and Zig
      # version and then restored from the cache.
      - name: Restore Nexus
        id: nexus
        uses: actions/cache@v4
        with:
          path: nexus/bin/nexus
          key: nexus-v1.0.0-zig-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Check out Nexus
        if: steps.nexus.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: shreeve/nexus
          ref: v1.0.0
          path: nexus

      - name: Build Nexus
        if: steps.nexus.outputs.cache-hit != 'true'
        working-directory: nexus
        run: zig build -Doptimize=ReleaseSafe

      - name: Build Rig
        run: zig build

      # test/run stops a test with GNU timeout, or with perl where there
      # is none (macOS).
      - name: Test
        # Release builds on a cold cache can take minutes on a CI runner.
        env:
          RIG_TEST_TIMEOUT: 300
        run: ./test/run -j 4
