name: test

# The whole suite on GitHub's runners, from a cold start: nightly and by
# hand, and for a pull request from a fork, where it adds information to
# the merge gate but is not it. Every pull request is tested on burst
# (tools/gate), and its merge checks come from gate.yml.
#
# No job here takes a name the ruleset on main requires (test
# (ubuntu-latest), test (macos-latest)); they are named cold (...). On a
# pull request from this repository they are skipped, under those names.
on:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/shards.yml
    with:
      os: ubuntu-latest

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/shards.yml
    with:
      os: macos-latest

  # Each passes only when every shard of its system passed.
  test-ubuntu:
    name: cold (ubuntu-latest)
    needs: ubuntu
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ubuntu.result }}" = success

  test-macos:
    name: cold (macos-latest)
    needs: macos
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.macos.result }}" = success
