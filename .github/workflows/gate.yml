name: gate

# The merge checks of every pull request. A pull request is tested on
# burst only when someone asks: tools/gate submits the suite and the
# corpus (and the matrix, for the paths it names) through cpuq, posts the
# commit status `rig/gate` as it
# starts (pending) and ends (success, failure, or error), and re-runs this
# workflow. This workflow runs no test; it reads that status. On a pull
# request from a branch of this repository it passes
#   - when the head commit has no `rig/gate` status: it was not gated,
#     which is the default, and
#   - when its newest `rig/gate` status is a success posted by a trusted
#     login (a gate that passed, or tools/gate --skip),
# and fails after a gate failed (or while one is pending, when the check
# runs then). A fork's pull
# request passes only with a trusted success: Steve reads it and runs
# tools/gate on it. The deep gate on main and the nightly cold run catch
# what an ungated pull request lets through.
#
# pull_request_target runs this file as the default branch (main) holds
# it, never a pull request's copy, and nothing here checks out or runs the
# pull request's code. The token reads statuses, the pull request, and
# commits, and nothing else.
#
# Its two jobs carry the names the ruleset on main requires, test
# (ubuntu-latest) and test (macos-latest), for every pull request, a
# fork's too: a fork's passes only once Steve has read it and run
# tools/gate on it (test/README.md, "The merge gate and CI"). A failing
# check of a required name blocks the merge even when a workflow of the
# pull request's own reports the same name passing. Neither job is ever
# skipped: a skipped required check counts as passing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  statuses: read
  contents: read
  pull-requests: read

jobs:
  verify:
    name: test (${{ matrix.os }})
    # Each job reports its own verdict: neither is cancelled when the
    # other fails.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Both checks make the same test, on the cheapest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read rig/gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          # The logins whose rig/gate status counts. Only a user with
          # write access can post a status at all.
          TRUSTED: shreeve
        run: |
          set -euo pipefail
          [[ $SHA =~ ^[0-9a-f]{40}$ && $NUMBER =~ ^[0-9]+$ ]] || { echo "::error::not a commit and a pull request: $SHA #$NUMBER"; exit 1; }
          # A branch of this repository, or a fork.
          head_repo=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name // ""')
          # The API lists a commit's statuses newest first.
          all=$(gh api --paginate "repos/$REPO/commits/$SHA/statuses?per_page=100" \
            --jq '.[] | select(.context == "rig/gate") | [.state, .creator.login, .created_at, .description] | @tsv')
          newest=${all%%$'\n'*}
          if [[ -z $newest ]]; then
            if [[ $head_repo == "$REPO" ]]; then
              echo "no rig/gate on $SHA: not gated, the default (tools/gate tests it on burst)"
              exit 0
            fi
            echo "::error::a fork's pull request needs rig/gate: Steve reads it and runs tools/gate on it"
            exit 1
          fi
          IFS=$'\t' read -r state creator at description <<<"$newest"
          echo "newest rig/gate on $SHA: $state, by $creator at $at: $description"
          trusted=""
          for login in $TRUSTED; do [[ $creator == "$login" ]] && trusted=1; done
          if [[ -z $trusted ]]; then
            echo "::error::rig/gate on $SHA was posted by $creator, who is not trusted ($TRUSTED)"
            exit 1
          fi
          case $state in
            success) echo "rig/gate passed on $SHA" ;;
            pending) echo "::error::rig/gate is running on burst for $SHA; tools/gate re-runs this check when it ends"; exit 1 ;;
            *) echo "::error::rig/gate on $SHA is $state: fix it and run tools/gate again, or tools/gate --skip"; exit 1 ;;
          esac
